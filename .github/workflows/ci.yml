name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agri-ecommerce-backend/pom.xml

      - name: Run backend tests
        working-directory: agri-ecommerce-backend
        run: bash mvnw test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agri-ecommerce-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: agri-ecommerce-frontend
        run: npm ci

      - name: Run ESLint with warning budget
        working-directory: agri-ecommerce-frontend
        run: npm run lint:ci

      - name: Build frontend
        working-directory: agri-ecommerce-frontend
        run: npm run build
